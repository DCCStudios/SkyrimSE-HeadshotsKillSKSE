; HeadshotsKill — default configuration (DLL: HeadshotsKill.dll)
; Built copy lives next to the DLL under Compile\SKSE\Plugins\
; For play: deploy Data\SKSE\Plugins\HeadshotsKill.ini (or copy from Compile output).
; You can also edit via SKSE Menu Framework (same keys).

[General]
bEnableMod=true
bEnableDebugLogging=false
fKillDamage=99999

[Victims]
bApplyToPlayerAndFollowers=false
; No OHKO when target level > attacker level + this
iLevelGapThreshold=30
; iEssentialMode: 0 = skip essentials, 1 = apply kill damage (engine may still prevent death)
iEssentialMode=0

[Chances]
; Percent 0–100 (giants/trolls/bears/mammoths add archery scaling via fSkillInfluence*)
fHumanoid=100
fSmallAnimal=100
fGiant=15
fTroll=20
fBear=10
fMammoth=8
; Giant FrostbiteSpiderRace (scale ≥ fGiantSpiderScaleThreshold); small spiders use fSmallAnimal
fGiantSpider=35
fChaurus=25
; FrostbiteSpiderRace: ref scale below = small animal, at/above = giant spider chance
fGiantSpiderScaleThreshold=1.15
fSkillInfluenceGiant=0.35
fSkillInfluenceTroll=0.35
fSkillInfluenceBear=0.5
fSkillInfluenceMammoth=0.4
fSkillInfluenceGiantSpider=0
fSkillInfluenceChaurus=0

[Combat]
; Only fully-drawn bow shots can trigger headshot kills (crossbows unaffected)
bRequireFullDraw=true
; How close to 1.0 counts as "fully drawn" (0.75 = at least 3/4 draw)
fFullDrawThreshold=0.75

[Helmet]
bEnableHelmetKnockoff=true
fKnockoffChance=30
bKnockoffCirclets=false
fDropLinearImpulse=3
fDropAngularImpulse=0.10
; Perk that lets headshots bypass helmets entirely (format: PluginName.esp:0xFormID, empty=disabled)
sHelmetBypassPerk=
; If true, headshots bypass helmet when target is X+ levels below shooter
bEnableLevelBypass=false
iLevelBypassThreshold=10

[BowChargePlus]
; If Bow Charge Plus is detected, max-charge arrows can penetrate helmets
bEnableBCPPenetration=true
; Base chance (%) to penetrate at full BCP charge
fBasePenetrationChance=5
; Archery skill below this adds nothing to penetration
fSkillThreshold=50
; Each archery point above threshold adds this % to penetration chance
fSkillScaleFactor=0.5

[Sound]
; Custom WAV when a headshot OHKO lands (Data/SKSE/Plugins/HeadshotsKill/<file>)
bEnableHeadshotKillSound=true
sHeadshotKillWav=headshotKillA.wav
; 0.0–1.0 (software gain on PCM samples, same idea as Simple Timed Block Addons)
fHeadshotKillVolume=1.0

[PlayerHelmet]
; Player helmet knock-off system (NPC headshots on the player)
bEnable=true
fKnockoffChance=30
; After knockoff, player health is reduced to this % of their current HP
fHealthReductionPercent=10
; Kill player instantly on headshot if they have no helmet at all (default off)
bKillOnBareHeadshot=false
; Seconds after knockoff where another headshot is lethal
fCooldownSeconds=30
bEnableCooldownKill=true
fDropImpulse=3
; Return helmet to inventory on save load if not picked up
bReturnOnLoad=true
; IRL minutes to track the knocked-off helmet before giving up
fTrackingDurationMinutes=5
; White highlight on dropped helmet
bEnableHighlight=true
fHighlightR=1.0
fHighlightG=1.0
fHighlightB=1.0
fHighlightAlpha=0.6
; Compass/map marker pointing to helmet
bEnableMapMarker=true
; WAV to play on player helmet knockoff (in Data/SKSE/Plugins/HeadshotsKill/, empty=none)
sKnockoffSound=helmetKnockoff.wav

[Lists]
; Race editor IDs (comma-separated). Headshot OHKO will not apply to these races.
; Falmer are eligible as humanoids (not blocklisted). Dwemer automatons are excluded in code.
sRaceBlocklist=DraugrRace,SkeletonRace,ElderRace,GhostRace,WispRace,IceWraithRace,LichRace,DremoraRace,AffinitySpriteRace,SeekerRace
; Keyword editor IDs; actors matching any of these are immune to headshot OHKO.
sKeywordImmune=ActorTypeUndead,ActorTypeGhost
; Spells whose projectiles can trigger headshot OHKO (format: Plugin.esp:0xFormID, comma-separated)
; Mod authors: add a JSON file to Data/SKSE/Plugins/HeadshotsKill/SpellAllowlist/ instead of editing this.
sSpellAllowlist=
